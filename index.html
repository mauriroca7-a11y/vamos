<title>VAMOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,800;1,900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1fa34a;--green-d:#0a8f3c;--ink:#1c2430;--mut:#6b7684;--bg:#f3f5f8;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe3ea;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;padding-bottom:96px;box-shadow:0 0 30px rgba(0,0,0,.12)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 13px;border:1.5px solid #dde2ea;border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 5px}

/* HERO */
.hero{position:relative;height:300px;overflow:hidden;background:linear-gradient(180deg,#1b2f7a 0%,#3b3f9c 22%,#8a4aa0 44%,#e0698f 62%,#f6a35c 80%,#fbc77a 100%)}
.hero svg.sil{position:absolute;left:0;bottom:0;width:100%;height:150px}
.hero .top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.hero .top .r{display:flex;gap:18px}
.ico{width:28px;height:28px;fill:#fff;display:block}
.logo{position:absolute;top:58px;left:0;right:0;text-align:center;z-index:2}
.logo .word{font-weight:900;font-style:italic;font-size:78px;line-height:1;color:#fff;letter-spacing:-3px;text-shadow:0 4px 10px rgba(0,0,0,.28);display:inline-flex;align-items:center;transform:skewX(-4deg)}
.logo .pin{width:50px;height:72px;margin:0 -2px;transform:translateY(-6px)}
.logo .swoosh{width:230px;height:14px;border-radius:14px;background:#5fe04a;margin:-2px auto 0;transform:rotate(-3deg);box-shadow:0 3px 6px rgba(0,0,0,.2)}
.logo .tag{font-family:'Caveat',cursive;font-weight:700;font-size:25px;color:#fff;margin-top:8px;transform:rotate(-3deg);text-shadow:0 2px 6px rgba(0,0,0,.35)}
.searchwrap{position:relative;z-index:5;margin:-26px 14px 0}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:40px;padding:0 18px;height:56px;box-shadow:0 8px 22px rgba(20,30,60,.22)}
.search svg{width:24px;height:24px;stroke:#444;fill:none;stroke-width:2;flex:none}
.search input{border:0;padding:0;height:100%;flex:1;background:transparent;font-size:15px}
.search button{display:flex}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:18px 14px 6px}
.tile{position:relative;height:92px;border-radius:12px;overflow:hidden;color:#fff;text-align:left;display:block;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.tile .em{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:40px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.tile .lb{position:absolute;left:0;right:0;bottom:0;padding:7px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:12.5px;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,.15))}
.tile .lb svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3}
.tile .cnt{position:absolute;top:6px;right:7px;background:rgba(0,0,0,.35);border-radius:10px;font-size:10.5px;padding:1px 7px;font-weight:600}

.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.sec h3{margin:0;font-size:16px;font-weight:600;display:flex;gap:7px;align-items:center}
.sec h3 svg{width:20px;height:20px;fill:#1c2430}
.sec a{color:var(--green-d);font-weight:600;font-size:13px;cursor:pointer}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px 8px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:none;width:158px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12);scroll-snap-align:start;text-align:left}
.pcard .im{height:96px;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px}
.pill{position:absolute;top:6px;left:6px;background:#fff;color:var(--green-d);font-size:10.5px;font-weight:700;border-radius:14px;padding:2px 8px;display:flex;align-items:center;gap:3px}
.pcard .nm{padding:7px 9px 9px;font-size:13px;font-weight:600;line-height:1.25}
.pcard .nm small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.empty{margin:10px 16px;padding:22px 16px;border:2px dashed #cfd6e1;border-radius:16px;text-align:center;color:var(--mut);font-size:14px}

/* NAV */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.1);z-index:30;border-radius:18px 18px 0 0}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#444;flex:1;font-weight:500}
nav button svg{width:27px;height:27px;stroke:#444;fill:none;stroke-width:1.8}
nav button.on{color:var(--green-d);font-weight:600}
nav button.on svg{stroke:var(--green-d)}
nav button.on.fill svg{fill:var(--green-d)}
.fab{position:fixed;bottom:92px;left:50%;margin-left:calc(min(240px,50vw) - 74px);width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 16px rgba(31,163,74,.5);z-index:25;display:flex;align-items:center;justify-content:center}

/* TOPBAR */

  async get(){try{const d=await this.open();return await new Promise(res=>{const g=d.transaction('k').objectStore('k').get('s');g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null)})}catch(e){try{return JSON.parse(localStorage.getItem('vamos_s'))}catch(_){return null}}},
  async set(v){try{const d=await this.open();d.transaction('k','readwrite').objectStore('k').put(v,'s')}catch(e){try{localStorage.setItem('vamos_s',JSON.stringify(v))}catch(_){toast('No se pudo guardar')}}}

/* ============ UTILIDADES ============ */
function parseCoords(txt){
  if(!txt)return null;let m;
  if(m=txt.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;]\s*(-?\d+(?:\.\d+)?)\s*$/))return{lat:+m[1],lng:+m[2]};
  if(m=txt.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/))return{lat:+m[1],lng:+m[2]};
  if(m=txt.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/))return{lat:+m[1],lng:+m[2]};
  if(m=txt.match(/[?&](?:q|ll|query|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/))return{lat:+m[1],lng:+m[2]};
  return null;
}
function coordsOf(p){
  if(p.lat!==''&&p.lat!=null&&p.lng!==''&&p.lng!=null&&!isNaN(+p.lat)&&!isNaN(+p.lng))return{lat:+p.lat,lng:+p.lng};
  return parseCoords(p.mapsUrl);
}
function mapsLink(p){
  const c=coordsOf(p);
  if(c)return`https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
  if(p.mapsUrl&&/^https?:/i.test(p.mapsUrl))return p.mapsUrl;
  if(p.address||p.name)return`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.name||'')+' '+(p.address||''))}`;
  return null;
}
function embedUrl(p){
  const c=coordsOf(p);
  if(c)return`https://maps.google.com/maps?q=${c.lat},${c.lng}&z=16&output=embed`;
  if(p.address)return`https://maps.google.com/maps?q=${encodeURIComponent(p.address)}&z=16&output=embed`;
  return null;
}
function km(p){
  const c=coordsOf(p);if(!c||!POS)return null;
  const R=6371,r=x=>x*Math.PI/180,dLa=r(c.lat-POS.lat),dLo=r(c.lng-POS.lng);
  const a=Math.sin(dLa/2)**2+Math.cos(r(POS.lat))*Math.cos(r(c.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const kmTxt=d=>d==null?'':'A '+(d<10?d.toFixed(1):Math.round(d))+' km';
function phones(p){return(p.phones||'').split(/\n|,|;/).map(s=>s.trim()).filter(Boolean)}
function waLink(n){let d=String(n).replace(/\D/g,'');if(d.length===8)d='591'+d;return d?'https://wa.me/'+d:null}
function socLink(type,v){
  v=(v||'').trim();if(!v)return null;if(/^https?:/i.test(v))return v;
  v=v.replace(/^@/,'');
  return({instagram:'https://instagram.com/',facebook:'https://facebook.com/',tiktok:'https://tiktok.com/@'}[type]||'https://')+v;
}
function resizeImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

/* ============ NAVEGACIÓN ============ */
const TABS=['home','map','favs','hist','account'];
function go(v){stack.push(view);SCR.push(window.scrollY||0);view=v;try{history.pushState({depth:stack.length},'')}catch(e){}render();window.scrollTo(0,0)}
function back(){if(stack.length)history.back();else tab('home')}
function tab(n){
  if(n==='home'){
    HQ='';listState.q='';
    if(stack.length>0){history.go(-stack.length)}
    else{view={n:'home'};render();window.scrollTo(0,0)}
    return;
  }
  if(view.n===n)return;
  go({n});
}
window.addEventListener('popstate',e=>{
  const s=e.state;
  const ov=document.querySelector('.ov');
  if(ov){ov.remove();try{history.pushState({depth:stack.length},'')}catch(_){}return}
  if(leaving){history.back();return}
  if(!s||s.g){
    if(stack.length>0){view=stack[0];stack=[];SCR=[];render();window.scrollTo(0,0);try{history.pushState({depth:0},'')}catch(_){}return}
    if(exitArmed){leaving=true;history.back();return}
    exitArmed=true;toast('Presiona otra vez para salir');clearTimeout(exitT);exitT=setTimeout(()=>{exitArmed=false},2500);
    try{history.pushState({depth:0},'')}catch(_){}
    return;
  }
  const d=s.depth;let sy=0;
  while(stack.length>d){view=stack.pop();sy=SCR.pop()||0}
  if(d!==stack.length){try{history.replaceState({depth:stack.length},'')}catch(_){}}
  render();window.scrollTo(0,sy);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){leaving=false;exitArmed=false;try{if(history.state&&history.state.g)history.pushState({depth:stack.length},'')}catch(_){}}
});
function openCat(id){listState={cat:id,q:'',near:false,favs:false};go({n:'list'})}

/* ============ RENDER ============ */
const app=document.getElementById('app');
function render(){
  let h='';
  switch(view.n){
    case'home':h=vHome();break;
    case'list':h=vList();break;
    case'detail':h=vDetail();break;
    case'form':h=vForm();break;
    case'map':h=vMap();break;
    case'favs':h=vFavs();break;
    case'hist':h=vHist();break;
    case'account':h=vAccount();break;
  }
  let navOn='home';
  if(TABS.includes(view.n))navOn=view.n;else{for(let i=stack.length-1;i>=0;i--){if(TABS.includes(stack[i].n)){navOn=stack[i].n;break}}}

/* ---- Búsqueda en vivo (sin tildes, varias palabras, resalta coincidencias) ---- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const terms=q=>norm(q).split(/\s+/).filter(Boolean);
const FIELDS=[['name','Nombre'],['desc','Descripción'],['refs','Referencia'],['address','Dirección'],['hours','Horarios'],['phones','Teléfono'],['reco','Recomendado'],['opinion','Mi opinión'],['contra','No me gustó'],['precio','Precio'],['notes','Notas'],['instagram','Instagram'],['facebook','Facebook'],['tiktok','TikTok'],['web','Web']];
const hayN=p=>norm(FIELDS.map(f=>p[f[0]]).concat([catOf(p.cat).n]).join(' | '));
function matchQ(p,q){const t=terms(q);if(!t.length)return true;const h=hayN(p);return t.every(x=>h.includes(x))}
function hl(text,q){
  text=String(text||'');const t=terms(q);if(!t.length)return esc(text);
  const n=norm(text);if(n.length!==text.length)return esc(text);
  const m=new Array(text.length).fill(0);
  t.forEach(x=>{let i=n.indexOf(x);while(i>=0){for(let k=i;k<i+x.length;k++)m[k]=1;i=n.indexOf(x,i+x.length)}});
  let o='',on=0;
  for(let k=0;k<text.length;k++){if(m[k]&&!on){o+='<mark>';on=1}if(!m[k]&&on){o+='</mark>';on=0}o+=esc(text[k])}
  return on?o+'</mark>':o;
}
function snip(p,q){
  const t=terms(q);
  for(const [k,l] of FIELDS){
    if(k==='name')continue;const v=String(p[k]||'');if(!v)continue;
    const n=norm(v);const i=Math.min(...t.map(x=>{const j=n.indexOf(x);return j<0?1e9:j}));
    if(i<1e9){const s=Math.max(0,i-25);const ex=v.slice(s,s+70).replace(/\n/g,' ');
      return`<span class="sn"><b>${l}:</b> ${s>0?'…':''}${hl(ex,q)}${s+70<v.length?'…':''}</span>`}
  }
  return'';
}
function score(p,q){const t=terms(q),n=norm(p.name);let s=0;t.forEach(x=>{if(n.startsWith(x))s+=4;else if(n.split(/\s+/).some(w=>w.startsWith(x)))s+=3;else if(n.includes(x))s+=2;else if(norm(catOf(p.cat).n).includes(x))s+=1});return s}
function sortList(r,L){
  if(L.q&&L.q.trim())return r.sort((a,b)=>score(b,L.q)-score(a,L.q)||a.name.localeCompare(b.name));
  if(L.best)return r.sort((a,b)=>(b.rating||0)-(a.rating||0)||a.name.localeCompare(b.name));
  if(L.near)return r.sort((a,b)=>(km(a)??1e9)-(km(b)??1e9));
  return r.sort((a,b)=>a.name.localeCompare(b.name));
}
function runList(){const L=listState;return sortList(S.places.filter(p=>(!L.cat||p.cat===L.cat)&&(!L.favs||p.fav)&&matchQ(p,L.q)),L)}

function starPicker(r){return[1,2,3,4,5].map(i=>`<button type="button" class="sp ${i<=r?'on':''}" onclick="setRate(${i})">★</button>`).join('')+`<span class="hint" style="margin-left:8px">${r?r+' de 5':'Sin calificar'}</span>`}

  ${f('address','Dirección','Calle, zona, ciudad')}
  <label>Enlace de Google Maps</label><div class="gpsrow"><input id="f_mapsUrl" value="${esc(d.mapsUrl)}" placeholder="Pega aquí el enlace de Google Maps" oninput="draft.mapsUrl=this.value;autoCoords()"></div>
  <div class="hint">En Google Maps: abre el lugar → Compartir → Copiar enlace, y pégalo aquí.</div>
  <label>Coordenadas GPS</label><div class="two"><input id="f_lat" value="${esc(d.lat)}" placeholder="Latitud" oninput="draft.lat=this.value"><input id="f_lng" value="${esc(d.lng)}" placeholder="Longitud" oninput="draft.lng=this.value"></div>
  <div class="gpsrow"><button style="padding:11px 14px;flex:1" onclick="useGPS()">📍 Usar mi ubicación actual (estoy en el lugar)</button></div>
  ${ta('refs','Referencias','Ej: frente a la plaza, a una cuadra del banco...')}
  <h5>Contacto</h5>
  ${ta('phones','Teléfonos (uno por línea)','70000000\n3-3123456')}
  ${f('whatsapp','WhatsApp (si es distinto)','70000000','tel')}
  <h5>Redes sociales</h5>
  ${f('instagram','Instagram','@usuario o enlace')}${f('facebook','Facebook','usuario o enlace')}${f('tiktok','TikTok','@usuario o enlace')}${f('web','Sitio web','www.ejemplo.com')}
  <h5>Horarios</h5>
  ${ta('hours','Horarios de atención','Lun a Vie: 8:00 - 20:00\nSáb y Dom: 9:00 - 22:00')}
  <h5>Mi calificación y opinión</h5>
  <label>Calificación</label><div id="stp">${starPicker(d.rating||0)}</div>
  ${ta('opinion','Mi opinión','¿Qué te pareció? Atención, sabor, limpieza, ambiente...')}
  ${ta('reco','Lo que me gustó / recomiendo','Qué pedir, a qué hora ir, qué probar...')}
  ${ta('contra','Lo que no me gustó','Para tenerlo en cuenta la próxima vez')}
  ${f('precio','Precio aproximado','Ej: 25 a 40 Bs por persona')}
  <h5>Fotos</h5>
  <div class="photos" id="phs">${photosHTML()}<label class="addph" style="margin:0">+<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this)"></label></div>
  ${ta('notes','Notas personales','Precios, platos favoritos, qué recomiendas...')}
  <div class="row2" style="margin-top:22px"><button class="btn s" onclick="back()">Cancelar</button><button class="btn" onclick="savePlace()">💾 Guardar</button></div></div>`;
}
const photosHTML=()=>draft.photos.map((s,i)=>`<div class="ph" style="background-image:url(${s})"><button onclick="rmPhoto(${i})">×</button></div>`).join('');
function refreshPhotos(){const el=document.getElementById('phs');el.innerHTML=photosHTML()+`<label class="addph" style="margin:0">+<input type="file" accept="image/*" multiple hidden onchange="addPhotos(this)"></label>`}
async function addPhotos(inp){toast('Procesando fotos...');for(const f of inp.files){const s=await resizeImg(f);if(s)draft.photos.push(s)}refreshPhotos()}
function rmPhoto(i){draft.photos.splice(i,1);refreshPhotos()}
function autoCoords(){const c=parseCoords(draft.mapsUrl);if(c){draft.lat=c.lat;draft.lng=c.lng;document.getElementById('f_lat').value=c.lat;document.getElementById('f_lng').value=c.lng}}
function useGPS(){
  if(!navigator.geolocation)return toast('Tu navegador no tiene GPS');
  toast('Buscando ubicación...');
  navigator.geolocation.getCurrentPosition(p=>{draft.lat=+p.coords.latitude.toFixed(6);draft.lng=+p.coords.longitude.toFixed(6);document.getElementById('f_lat').value=draft.lat;document.getElementById('f_lng').value=draft.lng;toast('Ubicación capturada ✅')},()=>toast('No se pudo obtener el GPS. Revisa los permisos.'),{enableHighAccuracy:true,timeout:15000});
}
function savePlace(){
  if(!draft.name.trim())return toast('Escribe el nombre del lugar');
  autoCoords&&0;
  const c=parseCoords(draft.mapsUrl);if(c&&(draft.lat===''||draft.lat==null)){draft.lat=c.lat;draft.lng=c.lng}
  const isNew=draft._new;delete draft._new;
  if(isNew)S.places.push(draft);else S.places=S.places.map(p=>p.id===draft.id?draft:p);
  save();toast('Lugar guardado ✅');
  if(isNew){view={n:'detail',id:draft.id};try{history.replaceState({depth:stack.length},'')}catch(e){}render();window.scrollTo(0,0)}else back();
}

/* --- MAPA --- */
function vMap(){
  const sel=S.places.find(p=>p.id===view.sel);
  let src;
  if(sel&&embedUrl(sel))src=embedUrl(sel);
  else if(POS)src=`https://maps.google.com/maps?q=${POS.lat},${POS.lng}&z=14&output=embed`;
  else src=`https://maps.google.com/maps?q=Bolivia&z=5&output=embed`;
  const r=S.places.filter(p=>embedUrl(p));
  r.sort((a,b)=>(km(a)??1e9)-(km(b)??1e9));
  return topbar('Mapa')+`<iframe class="mapf" src="${esc(src)}" loading="lazy"></iframe>
  ${sel?`<div style="padding:10px 14px"><div class="row2"><a class="btn" href="${esc(mapsLink(sel)||'#')}" target="_blank" rel="noopener">🧭 Cómo llegar a ${esc(sel.name)}</a></div></div>`:''}
  <div class="sec"><h3>${I.pinD} Lugares con ubicación</h3></div>
  ${r.length?r.map(p=>`<button class="li" onclick="view.sel='${p.id}';render();window.scrollTo(0,0)"><div class="th" style="background:linear-gradient(160deg,${catOf(p.cat).c[0]},${catOf(p.cat).c[1]})">${catOf(p.cat).e}</div><div class="tx"><b>${esc(p.name)}</b><span>${esc(p.address||catOf(p.cat).n)}</span>${kmTxt(km(p))?`<span class="km">${kmTxt(km(p))}</span>`:''}</div></button>`).join(''):`<div class="empty">Cuando agregues lugares con ubicación, aparecerán aquí.</div>`}`;
}

/* --- CUENTA --- */
function vAccount(){
  return topbar('Mi cuenta')+`<div class="form">
  <div class="stat"><div><b>${S.places.length}</b><span>Lugares</span></div><div><b>${S.places.filter(p=>p.fav).length}</b><span>Favoritos</span></div><div><b>${S.places.filter(p=>coordsOf(p)).length}</b><span>Con GPS</span></div></div>
  <label>Mi nombre</label><input value="${esc(S.name)}" placeholder="Tu nombre" oninput="S.name=this.value;save()">
  <h5>Instalar en mi celular</h5>
  ${isStandalone()?`<div class="blk" style="margin-top:10px"><p>✅ VAMOS ya está instalada. Tus lugares se guardan en este celular y no se borran al cerrar la app.</p></div>`:`<div class="hint" style="margin-top:8px">Instálala una sola vez: queda con su ícono y tus lugares se quedan guardados en este celular.</div><button class="btn" style="width:100%;margin-top:10px" onclick="installApp()">📲 Instalar app</button>`}
  <h5>Mis categorías</h5>
  <div class="hint">Además de las 12 de la pantalla principal, puedes crear las que quieras.</div>
  <div class="two" style="grid-template-columns:70px 1fr auto;margin-top:8px"><input id="ce" placeholder="🍺" maxlength="4" style="text-align:center"><input id="cn" placeholder="Ej: Bares"><button class="btn" style="padding:0 16px" onclick="addCat()">Crear</button></div>
  ${S.cats.map(c=>`<div class="li" style="cursor:default"><div class="th" style="width:44px;height:44px;font-size:22px;background:linear-gradient(160deg,${c.c[0]},${c.c[1]})">${c.e}</div><div class="tx"><b>${esc(c.n)}</b></div><button class="chip" onclick="delCat('${c.id}')">Quitar</button></div>`).join('')}
  <h5>Copia de seguridad</h5>
  <div class="hint">Tus lugares se guardan en este dispositivo. Descarga una copia de vez en cuando para no perderlos.</div>
  <div class="row2" style="margin-top:10px"><button class="btn s" onclick="exportData()">⬇️ Descargar copia</button><label class="btn s" style="margin:0">⬆️ Restaurar<input type="file" accept=".json" hidden onchange="importData(this)"></label></div>
  <div style="text-align:center;margin-top:28px;color:var(--mut);font-size:12px"><b style="color:var(--green-d)">VAMOS</b> · Descubre. Disfruta. Explora.</div></div>`;
}
function addCat(){
  const n=document.getElementById('cn').value.trim(),e=document.getElementById('ce').value.trim()||'📍';
  if(!n)return toast('Escribe el nombre de la categoría');
  S.cats.push({id:'c_'+uid(),n,e,c:EXTRA_COLORS[S.cats.length%EXTRA_COLORS.length]});save();render();toast('Categoría creada ✅');
}
function delCat(id){if(confirm('¿Quitar esta categoría? Los lugares quedarán como “Otros”.')){S.cats=S.cats.filter(c=>c.id!==id);save();render()}}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='vamos-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Copia descargada')}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.places))throw 0;if(!confirm('Esto reemplazará tus datos actuales. ¿Continuar?'))return;S=Object.assign({name:'',places:[],cats:[],hist:[]},d);save();render();toast('Copia restaurada ✅')}catch(e){toast('Archivo no válido')}};r.readAsText(f)}

/* ============ INICIO ============ */
(async()=>{
  const d=await DB.get();if(d)S=Object.assign(S,d);
  render();
  try{history.replaceState({g:1},'');history.pushState({depth:0},'')}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};if(['home','list','map'].includes(view.n)&&!document.activeElement.matches('input,textarea'))render()},()=>{},{timeout:8000,maximumAge:300000});
})();
</script>
</body>
</html>
